name: Prepare private AERA builder

on:
  workflow_dispatch:
    inputs:
      device_ref:
        description: Device branch, tag or commit
        type: string
        default: main
permissions:
  actions: read
  contents: read
  packages: write

jobs:
  prepare:
    uses: KAI-Miru/android_device_oneplus_hotdog-AERA/.github/workflows/prepare-builder.yml@ci-runner
    with:
      device_ref: ${{ inputs.device_ref }}
