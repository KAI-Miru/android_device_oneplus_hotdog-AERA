name: Prepare private AERA builder

on:
  workflow_dispatch:
    inputs:
      device_ref:
        description: Device branch, tag or commit
        type: string
        default: main
      kernel_url:
        description: HTTPS URL of your compatible ARM64 Image
        type: string
        required: true
      kernel_sha256:
        description: SHA256 of the supplied Image
        type: string
        required: true

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  prepare:
    uses: KAI-Miru/android_device_oneplus_hotdog-AERA/.github/workflows/prepare-builder.yml@ci-runner
    with:
      device_ref: ${{ inputs.device_ref }}
      kernel_url: ${{ inputs.kernel_url }}
      kernel_sha256: ${{ inputs.kernel_sha256 }}
