name: Hotdog native AERA recovery

on:
  workflow_dispatch:
    inputs:
      device_ref:
        description: Device branch, tag or commit
        type: string
        default: main
      use_prepared:
        description: Reuse the private prepared environment
        type: boolean
        default: false
      build_jobs:
        description: Parallel build jobs
        type: choice
        options: ['2', '4', '8']
        default: '4'

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  build:
    uses: KAI-Miru/android_device_oneplus_hotdog-AERA/.github/workflows/build-recovery.yml@ci-runner
    with:
      device_ref: ${{ inputs.device_ref }}
      use_prepared: ${{ inputs.use_prepared }}
      build_jobs: ${{ inputs.build_jobs }}
