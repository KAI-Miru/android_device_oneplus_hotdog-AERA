name: Hotdog native AERA recovery

on:
  workflow_call:
    inputs:
      device_ref:
        type: string
        required: true
      kernel_url:
        type: string
        default: ''
      kernel_sha256:
        type: string
        required: true
      runner_ref:
        type: string
        default: ci-runner
      use_prepared:
        type: boolean
        default: false
      build_jobs:
        type: string
        default: '4'
  workflow_dispatch:
    inputs:
      device_ref:
        description: Device branch, tag or commit
        type: string
        default: main
      kernel_url:
        description: Image HTTPS URL, or blank to reuse the approved private input
        type: string
        default: ''
      kernel_sha256:
        description: SHA256 of the supplied Image
        type: string
        required: true
      runner_ref:
        description: Runner branch, tag or commit
        type: string
        default: ci-runner
      use_prepared:
        description: Reuse the private prepared environment
        type: boolean
        default: false
      build_jobs:
        description: Parallel build jobs
        type: choice
        options: ['2', '4', '8']
        default: '4'

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: hotdog-image-${{ inputs.device_ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate-device.yml
    with:
      device_ref: ${{ inputs.device_ref }}
      runner_ref: ${{ inputs.runner_ref }}

  build:
    if: ${{ !inputs.use_prepared || vars.AERA_PREPARED_BUILDER == '' }}
    needs: validate
    runs-on: ${{ vars.AERA_BUILD_RUNNER || 'ubuntu-22.04' }}
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      packages: read
    env:
      BUILD_JOBS: ${{ inputs.build_jobs }}
      AERA_DEVICE_REVISION: ${{ needs.validate.outputs.device_revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.runner_revision }}
          path: runner
          persist-credentials: false
      - uses: ./runner/.github/actions/assemble
        id: inputs
        with:
          device_ref: ${{ needs.validate.outputs.device_revision }}
      - uses: ./runner/.github/actions/supply-image
        with:
          url: ${{ inputs.kernel_url }}
          sha256: ${{ inputs.kernel_sha256 }}
          build_inputs: ${{ steps.inputs.outputs.path }}
      - name: Free hosted-runner disk space
        if: runner.environment == 'github-hosted'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - name: Remove unused hosted SDKs
        if: runner.environment == 'github-hosted'
        run: |
          # Android supplies its own pinned compiler, JDK, Go and Rust tools.
          sudo rm -rf /usr/share/swift /usr/local/swift /usr/local/lib/node_modules /usr/local/share/powershell /usr/local/share/chromium /opt/az /opt/google /opt/microsoft /usr/lib/jvm
          sudo rm -rf "$HOME/.rustup" "$HOME/.cargo" "$HOME/.cache"
          df -h "$RUNNER_TEMP"
      - name: Install build prerequisites
        working-directory: ${{ steps.inputs.outputs.path }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bc binutils bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf libelf-dev liblz4-tool libncurses-dev libssl-dev libxml2 libxml2-utils lzop python3 python3-pip rsync unzip xsltproc zip zlib1g-dev
          python3 -m pip install -r tools/requirements.txt
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/aera-artifacts"
          echo "AERA_SOURCE_DIR=$RUNNER_TEMP/aera-source" >> "$GITHUB_ENV"
          echo "AERA_ARTIFACT_DIR=$RUNNER_TEMP/aera-artifacts" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 https://storage.googleapis.com/git-repo-downloads/repo -o "$RUNNER_TEMP/bin/repo"
          chmod 0755 "$RUNNER_TEMP/bin/repo"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Check build capacity
        run: |
          if [ "${{ runner.environment }}" = github-hosted ]; then
            swap_path="$RUNNER_TEMP/aera-swap"
            mnt_free=$(df -BG --output=avail /mnt | tail -1 | tr -dc '0-9')
            if [ "$mnt_free" -ge 10 ]; then
              swap_path=/mnt/aera-swap
            fi
            sudo fallocate -l 8G "$swap_path"
            sudo chmod 0600 "$swap_path"
            sudo mkswap "$swap_path"
            sudo swapon "$swap_path"
          fi
          df -h "$RUNNER_TEMP" /mnt | tee "$AERA_ARTIFACT_DIR/runner-capacity.txt"
          free_gib=$(df -BG --output=avail "$RUNNER_TEMP" | tail -1 | tr -dc '0-9')
          if [ "$free_gib" -lt 30 ]; then
            echo 'Insufficient free space for Android source. Set repository variable AERA_BUILD_RUNNER to a larger Linux runner label.' >&2
            exit 1
          fi
      - name: Build and verify native AERA boot image
        working-directory: ${{ steps.inputs.outputs.path }}
        run: bash ci/build.sh 2>&1 | tee "$AERA_ARTIFACT_DIR/session.log"
      - name: Upload verified device-test image
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hotdog-native-AERA-ALPHA-DEVICE-TEST
          path: |
            ${{ runner.temp }}/aera-artifacts/AERA-hotdog-ALPHA-recovery.img
            ${{ runner.temp }}/aera-artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hotdog-native-AERA-diagnostics
          path: |
            ${{ runner.temp }}/aera-artifacts/*.log
            ${{ runner.temp }}/aera-artifacts/*.json
            ${{ runner.temp }}/aera-artifacts/*.xml
            ${{ runner.temp }}/aera-artifacts/*.txt
          if-no-files-found: ignore
          retention-days: 14


  prepared:
    if: inputs.use_prepared && vars.AERA_PREPARED_BUILDER != ''
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      packages: write
    env:
      BUILD_JOBS: ${{ inputs.build_jobs }}
      PREPARED_BUILDER: ${{ vars.AERA_PREPARED_BUILDER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.validate.outputs.runner_revision }}
          path: runner
          persist-credentials: false
      - uses: ./runner/.github/actions/assemble
        id: inputs
        with:
          device_ref: ${{ needs.validate.outputs.device_revision }}
      - uses: ./runner/.github/actions/supply-image
        if: inputs.kernel_url != ''
        with:
          url: ${{ inputs.kernel_url }}
          sha256: ${{ inputs.kernel_sha256 }}
          build_inputs: ${{ steps.inputs.outputs.path }}
      - name: Free hosted-runner disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false
      - name: Prepare runner capacity
        run: |
          echo "DOCKER_CONFIG=$RUNNER_TEMP/docker-auth" >> "$GITHUB_ENV"
          sudo rm -rf /usr/share/swift /usr/local/swift /usr/local/lib/node_modules /usr/local/share/powershell /usr/local/share/chromium /opt/az /opt/google /opt/microsoft /usr/lib/jvm
          sudo rm -rf "$HOME/.rustup" "$HOME/.cargo" "$HOME/.cache"
          sudo fallocate -l 8G "$RUNNER_TEMP/aera-swap"
          sudo chmod 0600 "$RUNNER_TEMP/aera-swap"
          sudo mkswap "$RUNNER_TEMP/aera-swap"
          sudo swapon "$RUNNER_TEMP/aera-swap"
          mkdir -p "$RUNNER_TEMP/aera-artifacts" "$RUNNER_TEMP/aera-checkpoint" "$RUNNER_TEMP/docker-auth"
          df -h "$RUNNER_TEMP"
      - name: Pull the private pinned environment
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          prefix="ghcr.io/${OWNER,,}/hotdog-aera-builder@sha256:"
          [[ "$PREPARED_BUILDER" = "$prefix"* ]]
          [[ "${PREPARED_BUILDER#"$prefix"}" =~ ^[0-9a-f]{64}$ ]]
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$OWNER" --password-stdin
          docker pull "$PREPARED_BUILDER"
          printf '%s\n' "$PREPARED_BUILDER" > "$RUNNER_TEMP/aera-artifacts/prepared-builder.txt"
      - name: Require the existing private checkpoint destination
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api "users/$OWNER/packages/container/hotdog-aera-builder" > "$RUNNER_TEMP/package.json"
          python3 - "$RUNNER_TEMP/package.json" <<'PY'
          import json, os, sys
          package = json.load(open(sys.argv[1]))
          assert package['visibility'] == 'private', 'Checkpoint package must be private'
          assert package['repository']['full_name'] == os.environ['REPOSITORY'], 'Wrong checkpoint repository'
          PY
      - name: Compile and verify using prepared sources
        env:
          DEVICE_REVISION: ${{ needs.validate.outputs.device_revision }}
        run: |
          set -euo pipefail
          docker run --name "aera-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --platform=linux/amd64 \
            --mount "type=bind,source=${{ steps.inputs.outputs.path }},target=/device-tree,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/aera-artifacts,target=/artifacts" \
            --mount "type=bind,source=$RUNNER_TEMP/aera-checkpoint,target=/checkpoint" \
            --env "AERA_DEVICE_REVISION=$DEVICE_REVISION" --env "BUILD_JOBS=$BUILD_JOBS" \
            --env AERA_PREBUILT_KERNEL=/device-tree/external-inputs/Image \
            --env "AERA_KERNEL_SHA256=${{ inputs.kernel_sha256 }}" \
            --env AERA_CHECKPOINT_DIR=/checkpoint \
            "$PREPARED_BUILDER" 2>&1 | tee "$RUNNER_TEMP/aera-artifacts/session.log"
      - name: Upload verified device-test image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hotdog-native-AERA-ALPHA-DEVICE-TEST
          path: |
            ${{ runner.temp }}/aera-artifacts/AERA-hotdog-ALPHA-recovery.img
            ${{ runner.temp }}/aera-artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Publish the private compiled checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          checkpoint="$RUNNER_TEMP/aera-checkpoint"
          docker export "aera-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" |
            python3 "${{ steps.inputs.outputs.path }}/ci/export_checkpoint_runtime.py" "$checkpoint/runtime.tar"
          docker rm "aera-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          # The exact runtime is in runtime.tar; the immutable base remains
          # in GHCR. Release its local archive layers before checkpoint export.
          docker image rm "$PREPARED_BUILDER"
          package="ghcr.io/${OWNER,,}/hotdog-aera-builder"
          docker buildx build --progress=plain --platform=linux/amd64 --provenance=false \
            --file "${{ steps.inputs.outputs.path }}/ci/Checkpoint.Dockerfile" \
            --metadata-file "$RUNNER_TEMP/aera-artifacts/checkpoint-publish.json" \
            --output "type=image,name=$package:compiled-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT,push=true,compression=zstd,compression-level=5,oci-mediatypes=true" \
            "$checkpoint"
          export CHECKPOINT_PACKAGE="$package"
          python3 - "$RUNNER_TEMP/aera-artifacts" <<'PY'
          import json, os, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          digest = json.loads((root / 'checkpoint-publish.json').read_text())['containerimage.digest']
          result = json.loads((root / 'compiled-checkpoint.json').read_text())
          result['image'] = os.environ['CHECKPOINT_PACKAGE'] + '@' + digest
          (root / 'compiled-checkpoint-published.json').write_text(json.dumps(result, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('Private compiled checkpoint: `' + result['image'] + '`\n')
          PY
          gh api "users/$OWNER/packages/container/hotdog-aera-builder" --jq '.visibility' | grep -Fx private
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hotdog-native-AERA-diagnostics
          path: |
            ${{ runner.temp }}/aera-artifacts/*.log
            ${{ runner.temp }}/aera-artifacts/*.json
            ${{ runner.temp }}/aera-artifacts/*.xml
            ${{ runner.temp }}/aera-artifacts/*.txt
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove the disposable build container
        if: always()
        run: docker rm -f "aera-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" || true
