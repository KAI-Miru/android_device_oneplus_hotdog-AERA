name: Verify bundled F22 boot inputs
description: Verify original boot blobs and their matching WLAN module from the selected device revision
inputs:
  build_inputs:
    description: Assembled build input directory
    required: true
runs:
  using: composite
  steps:
    - name: Verify versioned original F22 inputs
      shell: bash
      env:
        BUILD_INPUTS: ${{ inputs.build_inputs }}
      run: |
        python3 "$BUILD_INPUTS/tools/kernel_input.py" --report "$RUNNER_TEMP/aera-artifacts/kernel-input.json"
